<script>
const topics = [
{
  id:1, title:"Execution context & call stack",
  why:"Every interview question about 'this', hoisting, or async relies on understanding how JS creates and manages execution contexts. It's the mental model that makes everything else click.",
  tags:["⭐ Must-know","Engine internals"],
  body:`
<div class="section-label">What is an execution context?</div>
<p class="prose">Every time JavaScript runs code, it creates an <strong>execution context</strong> — a container that holds information about the code being run. There are three types:</p>
<div class="pill-row"><span class="pill pill-purple">Global EC</span><span class="pill pill-amber">Function EC</span><span class="pill pill-green">Eval EC (rare)</span></div>
<p class="prose">Each execution context has three components:</p>
<div class="pill-row"><span class="pill pill-purple">Variable Environment</span><span class="pill pill-amber">Scope Chain</span><span class="pill pill-green">this binding</span></div>

<div class="section-label">The call stack</div>
<p class="prose">JavaScript is single-threaded. The <strong>call stack</strong> is a LIFO (Last In, First Out) data structure that tracks which function is currently running. When a function is called, its EC is pushed. When it returns, it's popped.</p>

<pre><span class="kw">function</span> <span class="fn">greet</span>(name) {
  <span class="kw">return</span> <span class="str">\`Hello, \${name}\`</span>;
}

<span class="kw">function</span> <span class="fn">main</span>() {
  <span class="kw">const</span> msg = <span class="fn">greet</span>(<span class="str">"Satvashil"</span>); <span class="cmt">// greet EC pushed</span>
  console.<span class="fn">log</span>(msg);             <span class="cmt">// greet EC popped before this</span>
}

<span class="fn">main</span>(); <span class="cmt">// main EC pushed onto global EC</span>

<span class="cmt">// Stack at peak:
// [Global EC] → [main EC] → [greet EC]</span></pre>

<div class="section-label">Two phases of an EC</div>
<p class="prose"><strong>1. Creation phase:</strong> Variables are hoisted (var → undefined, functions → fully hoisted, let/const → TDZ), <code>this</code> is determined, scope chain is set up.</p>
<p class="prose"><strong>2. Execution phase:</strong> Code runs line by line, variables are assigned actual values.</p>

<pre><span class="cmt">// Hoisting in action — creation phase</span>
console.<span class="fn">log</span>(x); <span class="cmt">// undefined (not ReferenceError)</span>
<span class="fn">sayHi</span>();        <span class="cmt">// "Hi!" — function fully hoisted</span>

<span class="kw">var</span> x = <span class="num">5</span>;
<span class="kw">function</span> <span class="fn">sayHi</span>() { console.<span class="fn">log</span>(<span class="str">"Hi!"</span>); }</pre>

<div class="gotcha"><strong>Stack overflow:</strong> Recursive functions without a base case exhaust the call stack. JS engines typically allow ~10,000–15,000 frames before throwing <code>RangeError: Maximum call stack size exceeded</code>.</div>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What happens when you call a function inside another function — how many ECs are on the stack?<span class="chev">▼</span></div><div class="qa-a">One EC per active function call, plus the global EC at the base. If <code>a</code> calls <code>b</code> calls <code>c</code>, the stack is: [Global] → [a EC] → [b EC] → [c EC]. When <code>c</code> returns, its EC is popped and control returns to <code>b</code>.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">Why can functions be called before they're declared in the file?<span class="chev">▼</span></div><div class="qa-a">Because of hoisting during the creation phase. Function declarations (not expressions) are fully hoisted — the entire function body is available before any code executes. Function expressions with <code>var</code> are hoisted as <code>undefined</code>, so calling them before assignment throws a TypeError.</div></div>
`
},
{
  id:2, title:"Scope & closures",
  why:"Closures are asked in virtually every JS interview. They're also the foundation of React hooks, module patterns, and memoization — so understanding them deeply unlocks multiple topic areas.",
  tags:["⭐ Must-know","High-frequency"],
  body:`
<div class="section-label">Scope</div>
<p class="prose"><strong>Lexical scope</strong> means a function's scope is determined by where it is <em>written</em> in the code, not where it is called from. Inner functions can access outer variables; the reverse is not true.</p>

<pre><span class="kw">const</span> globalVar = <span class="str">"I'm global"</span>;

<span class="kw">function</span> <span class="fn">outer</span>() {
  <span class="kw">const</span> outerVar = <span class="str">"I'm outer"</span>;

  <span class="kw">function</span> <span class="fn">inner</span>() {
    <span class="kw">const</span> innerVar = <span class="str">"I'm inner"</span>;
    console.<span class="fn">log</span>(globalVar); <span class="cmt">// ✅ accessible</span>
    console.<span class="fn">log</span>(outerVar);  <span class="cmt">// ✅ accessible</span>
  }

  <span class="cmt">// console.log(innerVar); // ❌ ReferenceError</span>
}

<span class="cmt">// Scope chain: inner → outer → global → null</span></pre>

<div class="section-label">Closures</div>
<p class="prose">A <strong>closure</strong> is when a function <em>remembers</em> its lexical scope even after the outer function has returned. The inner function keeps a live reference to the outer scope's variables — not a snapshot copy.</p>

<pre><span class="kw">function</span> <span class="fn">makeCounter</span>() {
  <span class="kw">let</span> count = <span class="num">0</span>;  <span class="cmt">// closed-over variable</span>

  <span class="kw">return</span> {
    increment: () => ++count,
    decrement: () => --count,
    value:     () => count
  };
}

<span class="kw">const</span> counter = <span class="fn">makeCounter</span>();
counter.<span class="fn">increment</span>(); <span class="cmt">// count = 1</span>
counter.<span class="fn">increment</span>(); <span class="cmt">// count = 2</span>
counter.<span class="fn">value</span>();     <span class="cmt">// 2 — outer fn is gone but count persists</span></pre>

<div class="section-label">Classic closure trap — the loop problem</div>
<pre><span class="cmt">// ❌ Bug — all timeouts log 3</span>
<span class="kw">for</span> (<span class="kw">var</span> i = <span class="num">0</span>; i < <span class="num">3</span>; i++) {
  setTimeout(() => console.<span class="fn">log</span>(i), <span class="num">1000</span>);
}

<span class="cmt">// ✅ Fix 1: use let (block scope per iteration)</span>
<span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < <span class="num">3</span>; i++) {
  setTimeout(() => console.<span class="fn">log</span>(i), <span class="num">1000</span>); <span class="cmt">// 0, 1, 2</span>
}

<span class="cmt">// ✅ Fix 2: IIFE to capture current i</span>
<span class="kw">for</span> (<span class="kw">var</span> i = <span class="num">0</span>; i < <span class="num">3</span>; i++) {
  ((<span class="kw">j</span>) => setTimeout(() => console.<span class="fn">log</span>(j), <span class="num">1000</span>))(i);
}</pre>

<div class="section-label">Real-world closure patterns</div>
<div class="pill-row"><span class="pill pill-purple">Counter / state machines</span><span class="pill pill-amber">Memoization</span><span class="pill pill-green">Module pattern</span><span class="pill pill-purple">Partial application</span></div>

<pre><span class="cmt">// Memoize with closure</span>
<span class="kw">function</span> <span class="fn">memoize</span>(fn) {
  <span class="kw">const</span> cache = <span class="kw">new</span> Map();
  <span class="kw">return</span> <span class="kw">function</span>(...args) {
    <span class="kw">const</span> key = JSON.<span class="fn">stringify</span>(args);
    <span class="kw">if</span> (cache.<span class="fn">has</span>(key)) <span class="kw">return</span> cache.<span class="fn">get</span>(key);
    <span class="kw">const</span> result = fn.<span class="fn">apply</span>(<span class="kw">this</span>, args);
    cache.<span class="fn">set</span>(key, result);
    <span class="kw">return</span> result;
  };
}</pre>

<div class="gotcha"><strong>Memory leak risk:</strong> Closures hold references to outer scope variables, preventing garbage collection. If a closure captures a large object and lives as long as the app (e.g., a global event listener), that object is never freed. Always remove event listeners when components unmount.</div>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is a closure? Give a practical use case.<span class="chev">▼</span></div><div class="qa-a">A closure is a function that retains access to its outer scope's variables after the outer function has returned. Practical uses: counters with private state, memoization caches, React hooks (useState stores state in a closure), partial application / currying, and the module pattern for encapsulation.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is an IIFE and why was it useful before ES modules?<span class="chev">▼</span></div><div class="qa-a">An IIFE (Immediately Invoked Function Expression) is a function that runs as soon as it's defined: <code>(function() { ... })()</code>. Before ES modules, it was the primary way to create private scope and avoid polluting the global namespace. Now largely replaced by ES module scope.</div></div>
`
},
{
  id:3, title:"var vs let vs const",
  why:"Candidates confuse hoisting and TDZ regularly. Interviewers use quick 'what does this output' snippets to filter. You must be able to reason through hoisting + TDZ without hesitation.",
  tags:["⭐ Must-know","Gotcha-heavy"],
  body:`
<div class="section-label">Quick comparison</div>
<div class="pill-row"><span class="pill pill-amber">var — function/global scope, hoisted</span><span class="pill pill-purple">let — block scope, TDZ</span><span class="pill pill-green">const — block scope, TDZ, no reassign</span></div>

<pre><span class="cmt">// var — function scoped, hoisted to undefined</span>
console.<span class="fn">log</span>(a); <span class="cmt">// undefined (not error)</span>
<span class="kw">var</span> a = <span class="num">1</span>;

<span class="cmt">// let — block scoped, Temporal Dead Zone</span>
console.<span class="fn">log</span>(b); <span class="cmt">// ❌ ReferenceError (TDZ)</span>
<span class="kw">let</span> b = <span class="num">2</span>;

<span class="cmt">// const — same as let but no reassignment</span>
<span class="kw">const</span> c = <span class="num">3</span>;
c = <span class="num">4</span>; <span class="cmt">// ❌ TypeError: Assignment to constant variable</span></pre>

<div class="section-label">Temporal Dead Zone (TDZ)</div>
<p class="prose">Both <code>let</code> and <code>const</code> ARE hoisted — but unlike <code>var</code>, they are not initialized. The period between the start of the scope and the declaration line is the <strong>Temporal Dead Zone</strong>. Any access in this zone throws a ReferenceError.</p>

<pre><span class="kw">function</span> <span class="fn">example</span>() {
  <span class="cmt">// TDZ for x starts here ↓</span>
  console.<span class="fn">log</span>(<span class="kw">typeof</span> x); <span class="cmt">// ❌ ReferenceError (not "undefined"!)</span>
  <span class="kw">let</span> x = <span class="num">10</span>;             <span class="cmt">// TDZ ends here ↑</span>
}
<span class="cmt">// Note: typeof undeclaredVar returns "undefined" safely
// but typeof TDZ variable throws — subtle difference!</span></pre>

<div class="section-label">const with objects — common misconception</div>
<pre><span class="kw">const</span> user = { name: <span class="str">"Satvashil"</span> };
user.name = <span class="str">"Updated"</span>; <span class="cmt">// ✅ allowed — mutating the object</span>
user = {};              <span class="cmt">// ❌ TypeError — reassigning the binding</span>

<span class="cmt">// const binds the variable, not the value.
// Use Object.freeze() for true immutability.</span>
<span class="kw">const</span> frozen = Object.<span class="fn">freeze</span>({ x: <span class="num">1</span> });
frozen.x = <span class="num">99</span>; <span class="cmt">// silently fails (or throws in strict mode)</span></pre>

<div class="section-label">Block scope in action</div>
<pre><span class="kw">if</span> (<span class="kw">true</span>) {
  <span class="kw">var</span>   v = <span class="str">"var"</span>;    <span class="cmt">// leaks OUT of block</span>
  <span class="kw">let</span>   l = <span class="str">"let"</span>;   <span class="cmt">// stays inside block</span>
  <span class="kw">const</span> c = <span class="str">"const"</span>; <span class="cmt">// stays inside block</span>
}
console.<span class="fn">log</span>(v); <span class="cmt">// "var"</span>
console.<span class="fn">log</span>(l); <span class="cmt">// ❌ ReferenceError</span></pre>

<div class="tip"><strong>Rule of thumb:</strong> Always use <code>const</code> by default. Use <code>let</code> only when you need to reassign. Never use <code>var</code> in modern code.</div>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">Are let and const hoisted?<span class="chev">▼</span></div><div class="qa-a">Yes — they are hoisted to the top of their block scope during the creation phase. But unlike <code>var</code>, they are not initialized (not set to <code>undefined</code>). They exist in the Temporal Dead Zone until the declaration line is reached. Accessing them in the TDZ throws a ReferenceError.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">Why does typeof on a TDZ variable throw instead of returning "undefined"?<span class="chev">▼</span></div><div class="qa-a"><code>typeof</code> on a truly undeclared variable safely returns <code>"undefined"</code>. But JS engines know that a <code>let</code>/<code>const</code> variable exists in the current scope (it's been hoisted but not initialized). Accessing it — even via <code>typeof</code> — triggers the TDZ guard and throws a ReferenceError.</div></div>
`
},
{
  id:4, title:"Prototypal inheritance",
  why:"Class syntax is just sugar over prototypes. Interviewers at product companies test whether you understand what 'class' actually compiles to — especially for questions about instanceof, prototype chain, and method lookup.",
  tags:["⭐ Must-know","OOP fundamentals"],
  body:`
<div class="section-label">The prototype chain</div>
<p class="prose">Every object in JavaScript has an internal <code>[[Prototype]]</code> slot that points to another object (or null). When you access a property, JS looks on the object first, then walks the chain until it finds it or hits null.</p>

<pre><span class="kw">const</span> animal = {
  breathe() { <span class="kw">return</span> <span class="str">"breathing"</span>; }
};

<span class="kw">const</span> dog = Object.<span class="fn">create</span>(animal); <span class="cmt">// dog's [[Prototype]] = animal</span>
dog.name = <span class="str">"Rex"</span>;

console.<span class="fn">log</span>(dog.name);    <span class="cmt">// "Rex" — own property</span>
console.<span class="fn">log</span>(dog.<span class="fn">breathe</span>()); <span class="cmt">// "breathing" — from prototype</span>

<span class="cmt">// Chain: dog → animal → Object.prototype → null</span></pre>

<div class="section-label">Constructor functions</div>
<pre><span class="kw">function</span> <span class="fn">Person</span>(name) {
  <span class="kw">this</span>.name = name; <span class="cmt">// own property</span>
}
Person.prototype.<span class="fn">greet</span> = <span class="kw">function</span>() {
  <span class="kw">return</span> <span class="str">\`Hi, I'm \${this.name}\`</span>;
}; <span class="cmt">// shared method on prototype</span>

<span class="kw">const</span> p = <span class="kw">new</span> <span class="fn">Person</span>(<span class="str">"Satvashil"</span>);
<span class="cmt">// new does 4 things:
// 1. Creates empty object {}
// 2. Sets [[Prototype]] to Person.prototype
// 3. Runs constructor with this = new object
// 4. Returns the object (unless fn returns object)</span>
p.<span class="fn">greet</span>(); <span class="cmt">// "Hi, I'm Satvashil"</span></pre>

<div class="section-label">class syntax — syntactic sugar</div>
<pre><span class="kw">class</span> Animal {
  <span class="fn">constructor</span>(name) { <span class="kw">this</span>.name = name; }
  <span class="fn">speak</span>() { <span class="kw">return</span> <span class="str">\`\${this.name} makes a sound\`</span>; }
}

<span class="kw">class</span> Dog <span class="kw">extends</span> Animal {
  <span class="fn">constructor</span>(name) { <span class="kw">super</span>(name); } <span class="cmt">// calls Animal constructor</span>
  <span class="fn">speak</span>() { <span class="kw">return</span> <span class="str">\`\${this.name} barks\`</span>; } <span class="cmt">// overrides</span>
}

<span class="kw">const</span> d = <span class="kw">new</span> <span class="fn">Dog</span>(<span class="str">"Rex"</span>);
d.<span class="fn">speak</span>();           <span class="cmt">// "Rex barks" — own method wins</span>
d <span class="kw">instanceof</span> Dog;    <span class="cmt">// true</span>
d <span class="kw">instanceof</span> Animal; <span class="cmt">// true — chain includes Animal.prototype</span>

<span class="cmt">// Under the hood — nothing changed from ES5:
// Dog.prototype.__proto__ === Animal.prototype</span></pre>

<div class="section-label">hasOwnProperty vs in</div>
<pre><span class="kw">const</span> obj = Object.<span class="fn">create</span>({ inherited: <span class="kw">true</span> });
obj.own = <span class="kw">true</span>;

<span class="str">'own'</span> <span class="kw">in</span> obj;              <span class="cmt">// true (checks chain)</span>
<span class="str">'inherited'</span> <span class="kw">in</span> obj;       <span class="cmt">// true (found in prototype)</span>
obj.<span class="fn">hasOwnProperty</span>(<span class="str">'own'</span>); <span class="cmt">// true</span>
obj.<span class="fn">hasOwnProperty</span>(<span class="str">'inherited'</span>); <span class="cmt">// false — not own</span></pre>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What does the new keyword actually do?<span class="chev">▼</span></div><div class="qa-a">Four things: (1) Creates a fresh empty object. (2) Sets the new object's [[Prototype]] to the constructor function's <code>.prototype</code> property. (3) Executes the constructor with <code>this</code> bound to the new object. (4) Returns the new object — unless the constructor explicitly returns a different object (primitives are ignored).</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">How is class different from a constructor function?<span class="chev">▼</span></div><div class="qa-a">Functionally near-identical under the hood — both use prototypes. Key differences: (1) Classes must be called with <code>new</code> (calling without throws a TypeError). (2) Class bodies run in strict mode. (3) Class methods are non-enumerable. (4) Classes are not hoisted like function declarations — they're in the TDZ. (5) <code>extends</code> sets up both prototype chains automatically.</div></div>
`
},
{
  id:5, title:"this keyword",
  why:"'What does this refer to here?' is one of the most common interview code-reading questions. Interviewers use it to test whether you understand binding rules vs just knowing that arrow functions inherit this.",
  tags:["⭐ Must-know","Code-reading"],
  body:`
<div class="section-label">The 4 binding rules (in priority order)</div>
<div class="pill-row"><span class="pill pill-red">1. new binding</span><span class="pill pill-amber">2. Explicit (call/apply/bind)</span><span class="pill pill-purple">3. Implicit (method call)</span><span class="pill pill-green">4. Default (global/undefined)</span></div>

<pre><span class="cmt">// 3. Implicit binding — this = object before the dot</span>
<span class="kw">const</span> user = {
  name: <span class="str">"Satvashil"</span>,
  <span class="fn">greet</span>() { <span class="kw">return</span> <span class="str">\`Hi \${this.name}\`</span>; }
};
user.<span class="fn">greet</span>(); <span class="cmt">// "Hi Satvashil" — this = user</span>

<span class="cmt">// Implicit binding LOST — common bug</span>
<span class="kw">const</span> fn = user.greet; <span class="cmt">// just a reference, no object</span>
<span class="fn">fn</span>(); <span class="cmt">// "Hi undefined" (strict) or "Hi [global.name]"</span></pre>

<pre><span class="cmt">// 2. Explicit binding</span>
<span class="kw">function</span> <span class="fn">intro</span>(role) { <span class="kw">return</span> <span class="str">\${this.name} is \${role}\`; }
<span class="kw">const</span> obj = { name: <span class="str">"Satvashil"</span> };

intro.<span class="fn">call</span>(obj, <span class="str">"dev"</span>);      <span class="cmt">// args comma-separated</span>
intro.<span class="fn">apply</span>(obj, [<span class="str">"dev"</span>]);   <span class="cmt">// args as array</span>
<span class="kw">const</span> bound = intro.<span class="fn">bind</span>(obj); <span class="cmt">// returns new function, this is locked</span>
<span class="fn">bound</span>(<span class="str">"dev"</span>);                  <span class="cmt">// can call later</span></pre>

<pre><span class="cmt">// 1. new binding — this = newly created object</span>
<span class="kw">function</span> <span class="fn">Car</span>(model) { <span class="kw">this</span>.model = model; }
<span class="kw">const</span> c = <span class="kw">new</span> <span class="fn">Car</span>(<span class="str">"Tesla"</span>); <span class="cmt">// this = new empty object</span></pre>

<div class="section-label">Arrow functions — lexical this</div>
<p class="prose">Arrow functions do NOT have their own <code>this</code>. They inherit <code>this</code> from the <strong>enclosing lexical scope</strong> at the time they were defined. They cannot be rebound with <code>call/apply/bind</code>.</p>

<pre><span class="kw">class</span> Timer {
  <span class="fn">constructor</span>() {
    <span class="kw">this</span>.count = <span class="num">0</span>;
  }

  <span class="fn">startBroken</span>() {
    setInterval(<span class="kw">function</span>() {
      <span class="kw">this</span>.count++; <span class="cmt">// ❌ this = undefined (strict) or global</span>
    }, <span class="num">1000</span>);
  }

  <span class="fn">startFixed</span>() {
    setInterval(() => {
      <span class="kw">this</span>.count++; <span class="cmt">// ✅ this = Timer instance (lexical)</span>
    }, <span class="num">1000</span>);
  }
}</pre>

<div class="section-label">this in event handlers (browser)</div>
<pre>button.<span class="fn">addEventListener</span>(<span class="str">"click"</span>, <span class="kw">function</span>() {
  console.<span class="fn">log</span>(<span class="kw">this</span>); <span class="cmt">// the button element</span>
});

button.<span class="fn">addEventListener</span>(<span class="str">"click"</span>, () => {
  console.<span class="fn">log</span>(<span class="kw">this</span>); <span class="cmt">// the enclosing scope (often Window)</span>
});</pre>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is the difference between call, apply, and bind?<span class="chev">▼</span></div><div class="qa-a"><code>call(thisArg, arg1, arg2)</code> — calls the function immediately with args spread out. <code>apply(thisArg, [arg1, arg2])</code> — calls immediately with args as an array. <code>bind(thisArg, arg1)</code> — returns a new function with <code>this</code> permanently locked; can also partially apply arguments. Use <code>bind</code> when you need to pass a method as a callback without losing its context.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">Can you change what 'this' refers to inside an arrow function?<span class="chev">▼</span></div><div class="qa-a">No. Arrow functions capture <code>this</code> from their lexical scope at definition time and it cannot be changed. Calling <code>.call()</code>, <code>.apply()</code>, or <code>.bind()</code> on an arrow function ignores the provided <code>this</code> argument entirely — the lexically bound <code>this</code> is used instead.</div></div>
`
},
{
  id:6, title:"Event loop",
  why:"The most commonly tested 'deep JS' topic at product companies. A wrong answer signals you don't really know JS runtime — it disqualifies strong-looking resumes. Understanding it is also essential for all Node.js answers.",
  tags:["⭐ Must-know","Runtime internals","Node.js overlap"],
  body:`
<div class="section-label">The components</div>
<div class="pill-row"><span class="pill pill-purple">Call stack</span><span class="pill pill-amber">Web APIs / libuv</span><span class="pill pill-green">Microtask queue</span><span class="pill pill-red">Task queue (macrotask)</span></div>

<p class="prose"><strong>Call stack</strong> — where synchronous code runs. One function at a time.</p>
<p class="prose"><strong>Web APIs / libuv</strong> — handles async operations (setTimeout, fetch, fs.readFile). Offloads work and schedules callbacks when done.</p>
<p class="prose"><strong>Microtask queue</strong> — Promise callbacks (<code>.then</code>, <code>.catch</code>), <code>queueMicrotask</code>, <code>MutationObserver</code>. <strong>Drained completely</strong> before the next task.</p>
<p class="prose"><strong>Task queue (macrotask)</strong> — <code>setTimeout</code>, <code>setInterval</code>, I/O callbacks, <code>setImmediate</code> (Node). One task per event loop turn.</p>

<div class="section-label">Priority order (critical)</div>
<pre><span class="cmt">// Order of execution:</span>
console.<span class="fn">log</span>(<span class="str">"1 — sync"</span>);

setTimeout(() => console.<span class="fn">log</span>(<span class="str">"4 — macrotask"</span>), <span class="num">0</span>);

Promise.<span class="fn">resolve</span>().<span class="fn">then</span>(() => console.<span class="fn">log</span>(<span class="str">"3 — microtask"</span>));

console.<span class="fn">log</span>(<span class="str">"2 — sync"</span>);

<span class="cmt">// Output: 1, 2, 3, 4
//
// Rule: sync → ALL microtasks → ONE macrotask → ALL microtasks → ...</span></pre>

<div class="section-label">Microtask starvation</div>
<pre><span class="cmt">// Danger: infinite microtasks block the event loop</span>
<span class="kw">function</span> <span class="fn">flood</span>() {
  Promise.<span class="fn">resolve</span>().<span class="fn">then</span>(<span class="fn">flood</span>); <span class="cmt">// recursive microtask</span>
}
<span class="fn">flood</span>();
<span class="cmt">// setTimeout callback NEVER runs — microtask queue never empties</span></pre>

<div class="section-label">Node.js event loop phases (bonus depth)</div>
<pre><span class="cmt">// Node.js has specific phases:
// timers → pending I/O → idle → poll → check → close
//
// process.nextTick: runs BEFORE the next phase (highest priority)
// Promise microtasks: run after nextTick queue empties
// setImmediate: runs in the 'check' phase</span>

process.<span class="fn">nextTick</span>(() => console.<span class="fn">log</span>(<span class="str">"A — nextTick"</span>));
Promise.<span class="fn">resolve</span>().<span class="fn">then</span>(() => console.<span class="fn">log</span>(<span class="str">"B — promise"</span>));
setTimeout(() => console.<span class="fn">log</span>(<span class="str">"C — timer"</span>), <span class="num">0</span>);
setImmediate(() => console.<span class="fn">log</span>(<span class="str">"D — immediate"</span>));
<span class="cmt">// Node output: A, B, C/D (order of C/D depends on timing)</span></pre>

<div class="gotcha"><strong>Zero-delay setTimeout is not instant:</strong> <code>setTimeout(fn, 0)</code> still goes through the macrotask queue. The callback will only run after: (1) current sync code finishes, and (2) ALL microtasks are drained. The actual minimum delay is ~1ms, not 0.</div>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is the output? setTimeout 0 vs Promise.resolve().then<span class="chev">▼</span></div><div class="qa-a">Promise.resolve().then always runs before setTimeout(fn, 0). Promises schedule callbacks on the microtask queue, which is fully drained before the event loop picks up the next macrotask (the setTimeout callback). Even if the setTimeout was registered first, the Promise callback fires first.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">How does JavaScript run async code if it's single-threaded?<span class="chev">▼</span></div><div class="qa-a">The browser (or Node.js via libuv) provides C++ threads to handle I/O, timers, and network requests outside the JS thread. When those operations complete, their callbacks are placed in the appropriate queue (micro or macro). The event loop's job is to pick callbacks from those queues and push them onto the call stack one at a time — only when the stack is empty. So JS is single-threaded in its execution, but leverages OS-level async for I/O.</div></div>
`
},
{
  id:7, title:"Promises",
  why:"Promise internals and combinators are tested constantly. You need to reason about execution order, chaining, error propagation, and the exact behavior of each combinator — not just 'Promise wraps async code.'",
  tags:["⭐ Must-know","Async foundation"],
  body:`
<div class="section-label">Promise states</div>
<div class="pill-row"><span class="pill pill-amber">pending</span><span class="pill pill-green">fulfilled</span><span class="pill pill-red">rejected</span></div>
<p class="prose">A promise transitions from pending to fulfilled (resolved) or rejected exactly once. It is <strong>immutable</strong> after settlement — calling resolve/reject again has no effect.</p>

<pre><span class="kw">const</span> p = <span class="kw">new</span> Promise((resolve, reject) => {
  <span class="cmt">// executor runs synchronously</span>
  setTimeout(() => resolve(<span class="str">"done"</span>), <span class="num">1000</span>);
  <span class="cmt">// reject("error") would transition to rejected instead</span>
});

p.<span class="fn">then</span>(val => console.<span class="fn">log</span>(val))   <span class="cmt">// "done" after 1s</span>
 .<span class="fn">catch</span>(err => console.<span class="fn">log</span>(err)) <span class="cmt">// only if rejected</span>
 .<span class="fn">finally</span>(() => <span class="cmt">/* always runs */</span>);</pre>

<div class="section-label">Chaining — return value matters</div>
<pre>Promise.<span class="fn">resolve</span>(<span class="num">1</span>)
  .<span class="fn">then</span>(x => x + <span class="num">1</span>)      <span class="cmt">// returns 2 — wrapped in new promise</span>
  .<span class="fn">then</span>(x => x * <span class="num">3</span>)      <span class="cmt">// returns 6</span>
  .<span class="fn">then</span>(x => { <span class="kw">throw</span> <span class="kw">new</span> Error(<span class="str">"oops"</span>); }) <span class="cmt">// jumps to catch</span>
  .<span class="fn">catch</span>(e => console.<span class="fn">log</span>(e.message));  <span class="cmt">// "oops"</span>

<span class="cmt">// Returning a promise from .then() unwraps it (flattens)</span>
Promise.<span class="fn">resolve</span>(<span class="num">1</span>)
  .<span class="fn">then</span>(x => Promise.<span class="fn">resolve</span>(x + <span class="num">1</span>)) <span class="cmt">// NOT a nested promise</span>
  .<span class="fn">then</span>(x => console.<span class="fn">log</span>(x));        <span class="cmt">// 2 — auto-unwrapped</span></pre>

<div class="section-label">Combinators — the must-know four</div>
<pre><span class="kw">const</span> p1 = Promise.<span class="fn">resolve</span>(<span class="num">1</span>);
<span class="kw">const</span> p2 = Promise.<span class="fn">resolve</span>(<span class="num">2</span>);
<span class="kw">const</span> p3 = Promise.<span class="fn">reject</span>(<span class="str">"err"</span>);

<span class="cmt">// Promise.all — waits for ALL, rejects on FIRST failure</span>
Promise.<span class="fn">all</span>([p1, p2]).<span class="fn">then</span>(([a,b]) => <span class="cmt">/*[1,2]*/</span>);
Promise.<span class="fn">all</span>([p1, p3]).<span class="fn">catch</span>(e => <span class="cmt">// "err" — fast-fail</span>);

<span class="cmt">// Promise.allSettled — waits for ALL regardless of failure</span>
Promise.<span class="fn">allSettled</span>([p1, p3]).<span class="fn">then</span>(results => {
  <span class="cmt">// [{status:"fulfilled", value:1}, {status:"rejected", reason:"err"}]</span>
});

<span class="cmt">// Promise.race — settles with FIRST to settle (fulfilled or rejected)</span>
Promise.<span class="fn">race</span>([p1, p3]); <span class="cmt">// p1 (already fulfilled, resolves first)</span>

<span class="cmt">// Promise.any — resolves with FIRST fulfilled, rejects if ALL reject</span>
Promise.<span class="fn">any</span>([p3, p1]); <span class="cmt">// 1 — ignores the rejection</span></pre>

<div class="section-label">Implementing Promise.all from scratch</div>
<pre><span class="kw">function</span> <span class="fn">promiseAll</span>(promises) {
  <span class="kw">return new</span> Promise((resolve, reject) => {
    <span class="kw">const</span> results = [];
    <span class="kw">let</span> remaining = promises.length;
    <span class="kw">if</span> (remaining === <span class="num">0</span>) { resolve(results); <span class="kw">return</span>; }

    promises.<span class="fn">forEach</span>((p, i) => {
      Promise.<span class="fn">resolve</span>(p).<span class="fn">then</span>(val => {
        results[i] = val;
        <span class="kw">if</span> (--remaining === <span class="num">0</span>) resolve(results);
      }).<span class="fn">catch</span>(reject); <span class="cmt">// first rejection wins</span>
    });
  });
}</pre>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is the difference between Promise.all and Promise.allSettled?<span class="chev">▼</span></div><div class="qa-a"><code>Promise.all</code> rejects immediately when any promise rejects (fail-fast). It gives you the rejection reason but none of the successful values. Use when all results are needed and a failure should stop everything. <code>Promise.allSettled</code> waits for all promises to complete regardless of outcome. It always fulfills with an array of result objects, each with a <code>status</code> of "fulfilled" or "rejected". Use when you want to know the outcome of each independent operation (e.g., sending 5 notifications in parallel).</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What happens if you throw inside a .then() callback?<span class="chev">▼</span></div><div class="qa-a">The thrown error is caught by the promise machinery and the next <code>.catch()</code> in the chain is invoked with the error. It's equivalent to returning <code>Promise.reject(error)</code> from the <code>.then</code> callback. This is why a single <code>.catch()</code> at the end of a chain can handle errors thrown anywhere in the chain.</div></div>
`
},
{
  id:8, title:"async / await",
  why:"async/await is the primary syntax for async code today. Interviewers test sequential vs parallel execution mistakes — a very common bug where developers accidentally serialize parallel operations, making code 2–10x slower.",
  tags:["⭐ Must-know","Common bugs"],
  body:`
<div class="section-label">How async/await works under the hood</div>
<p class="prose"><code>async</code> functions always return a Promise. <code>await</code> suspends the function, yields control back to the caller, and resumes when the awaited promise settles. It's syntactic sugar over <code>.then()</code> chains — the JS engine desugars it.</p>

<pre><span class="cmt">// These are functionally equivalent:</span>
<span class="kw">async function</span> <span class="fn">fetchUser</span>() {
  <span class="kw">const</span> res = <span class="kw">await</span> fetch(<span class="str">"/api/user"</span>);
  <span class="kw">return</span> res.<span class="fn">json</span>();
}

<span class="cmt">// Desugared to roughly:</span>
<span class="kw">function</span> <span class="fn">fetchUser</span>() {
  <span class="kw">return</span> fetch(<span class="str">"/api/user"</span>).<span class="fn">then</span>(res => res.<span class="fn">json</span>());
}</pre>

<div class="section-label">Error handling</div>
<pre><span class="cmt">// Pattern 1: try/catch (preferred for most cases)</span>
<span class="kw">async function</span> <span class="fn">load</span>() {
  <span class="kw">try</span> {
    <span class="kw">const</span> data = <span class="kw">await</span> <span class="fn">fetchUser</span>();
    <span class="kw">return</span> data;
  } <span class="kw">catch</span> (err) {
    console.<span class="fn">error</span>(<span class="str">"Failed:"</span>, err);
    <span class="kw">throw</span> err; <span class="cmt">// re-throw or handle</span>
  }
}

<span class="cmt">// Pattern 2: .catch() on the awaited promise</span>
<span class="kw">const</span> data = <span class="kw">await</span> <span class="fn">fetchUser</span>().<span class="fn">catch</span>(err => <span class="kw">null</span>);
<span class="kw">if</span> (!data) <span class="kw">return</span>; <span class="cmt">// handle null sentinel</span></pre>

<div class="section-label">⭐ Sequential vs parallel — the most common bug</div>
<pre><span class="cmt">// ❌ Sequential — total time = A + B (wasteful if independent)</span>
<span class="kw">const</span> user    = <span class="kw">await</span> <span class="fn">getUser</span>(id);     <span class="cmt">// wait 200ms</span>
<span class="kw">const</span> orders  = <span class="kw">await</span> <span class="fn">getOrders</span>(id);   <span class="cmt">// wait 300ms (starts AFTER)</span>
<span class="cmt">// Total: 500ms</span>

<span class="cmt">// ✅ Parallel — total time = max(A, B)</span>
<span class="kw">const</span> [user, orders] = <span class="kw">await</span> Promise.<span class="fn">all</span>([
  <span class="fn">getUser</span>(id),    <span class="cmt">// starts immediately</span>
  <span class="fn">getOrders</span>(id)   <span class="cmt">// starts immediately</span>
]);
<span class="cmt">// Total: 300ms</span></pre>

<div class="section-label">async in loops — another common trap</div>
<pre><span class="cmt">// ❌ forEach does NOT await — all run concurrently uncontrolled</span>
ids.<span class="fn">forEach</span>(<span class="kw">async</span> (id) => {
  <span class="kw">await</span> <span class="fn">process</span>(id); <span class="cmt">// outer forEach doesn't wait</span>
});

<span class="cmt">// ✅ for...of — sequential (each awaits before next)</span>
<span class="kw">for</span> (<span class="kw">const</span> id <span class="kw">of</span> ids) {
  <span class="kw">await</span> <span class="fn">process</span>(id);
}

<span class="cmt">// ✅ Promise.all — parallel with all results</span>
<span class="kw">await</span> Promise.<span class="fn">all</span>(ids.<span class="fn">map</span>(id => <span class="fn">process</span>(id)));</pre>

<div class="section-label">await on non-Promise values</div>
<pre><span class="kw">const</span> x = <span class="kw">await</span> <span class="num">42</span>;       <span class="cmt">// fine — wrapped in Promise.resolve(42)</span>
<span class="kw">const</span> y = <span class="kw">await</span> <span class="kw">null</span>;     <span class="cmt">// fine — resolves immediately</span>
<span class="kw">const</span> z = <span class="kw">await</span> { then: () => {} }; <span class="cmt">// treated as a thenable!</span></pre>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is the return type of an async function that returns 5?<span class="chev">▼</span></div><div class="qa-a">A Promise that resolves to 5. Even though you write <code>return 5</code>, the <code>async</code> keyword wraps the return value in <code>Promise.resolve(5)</code>. If you <code>await</code> the function call, you get 5. If you don't, you get a pending Promise.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">How do you run 3 independent async operations in parallel and wait for all?<span class="chev">▼</span></div><div class="qa-a">Use <code>Promise.all([op1(), op2(), op3()])</code> and await it. This starts all 3 operations at the same time. Total time = the slowest operation, not the sum. If you used three sequential awaits, total time would be the sum. Use <code>Promise.allSettled</code> if you don't want a single failure to abort the others.</div></div>
`
},
{
  id:9, title:"Higher-order functions",
  why:"map/filter/reduce are asked in almost every screening. More importantly, interviewers expect you to implement them from scratch or compose them — showing you understand function composition, not just array APIs.",
  tags:["⭐ Must-know","Coding round basics"],
  body:`
<div class="section-label">map — transform each element</div>
<pre><span class="kw">const</span> nums = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>];
nums.<span class="fn">map</span>(x => x * <span class="num">2</span>); <span class="cmt">// [2, 4, 6] — new array, same length</span>

<span class="cmt">// Implementing map from scratch:</span>
Array.prototype.<span class="fn">myMap</span> = <span class="kw">function</span>(fn) {
  <span class="kw">const</span> result = [];
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < <span class="kw">this</span>.length; i++) {
    result.<span class="fn">push</span>(<span class="fn">fn</span>(<span class="kw">this</span>[i], i, <span class="kw">this</span>)); <span class="cmt">// element, index, array</span>
  }
  <span class="kw">return</span> result;
};</pre>

<div class="section-label">filter — keep matching elements</div>
<pre><span class="kw">const</span> evens = nums.<span class="fn">filter</span>(x => x % <span class="num">2</span> === <span class="num">0</span>); <span class="cmt">// [2]</span>

<span class="cmt">// Implementing filter from scratch:</span>
Array.prototype.<span class="fn">myFilter</span> = <span class="kw">function</span>(fn) {
  <span class="kw">const</span> result = [];
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < <span class="kw">this</span>.length; i++) {
    <span class="kw">if</span> (<span class="fn">fn</span>(<span class="kw">this</span>[i], i, <span class="kw">this</span>)) result.<span class="fn">push</span>(<span class="kw">this</span>[i]);
  }
  <span class="kw">return</span> result;
};</pre>

<div class="section-label">reduce — fold into a single value</div>
<pre><span class="kw">const</span> sum = nums.<span class="fn">reduce</span>((acc, cur) => acc + cur, <span class="num">0</span>); <span class="cmt">// 6</span>

<span class="cmt">// Powerful patterns with reduce:</span>
<span class="kw">const</span> people = [
  { name: <span class="str">"Alice"</span>, dept: <span class="str">"eng"</span> },
  { name: <span class="str">"Bob"</span>,   dept: <span class="str">"eng"</span> },
  { name: <span class="str">"Carol"</span>, dept: <span class="str">"hr"</span>  }
];

<span class="cmt">// Group by department using reduce</span>
people.<span class="fn">reduce</span>((groups, person) => {
  (groups[person.dept] = groups[person.dept] || []).<span class="fn">push</span>(person);
  <span class="kw">return</span> groups;
}, {}); <span class="cmt">// { eng: [Alice, Bob], hr: [Carol] }</span>

<span class="cmt">// Implementing reduce from scratch:</span>
Array.prototype.<span class="fn">myReduce</span> = <span class="kw">function</span>(fn, initial) {
  <span class="kw">let</span> acc = initial !== <span class="kw">undefined</span> ? initial : <span class="kw">this</span>[<span class="num">0</span>];
  <span class="kw">let</span> start = initial !== <span class="kw">undefined</span> ? <span class="num">0</span> : <span class="num">1</span>;
  <span class="kw">for</span> (<span class="kw">let</span> i = start; i < <span class="kw">this</span>.length; i++) {
    acc = <span class="fn">fn</span>(acc, <span class="kw">this</span>[i], i, <span class="kw">this</span>);
  }
  <span class="kw">return</span> acc;
};</pre>

<div class="section-label">flatMap, some, every, find</div>
<pre><span class="kw">const</span> nested = [[<span class="num">1</span>,<span class="num">2</span>], [<span class="num">3</span>,<span class="num">4</span>]];
nested.<span class="fn">flatMap</span>(x => x);      <span class="cmt">// [1,2,3,4] — map then flatten 1 level</span>
nested.<span class="fn">flat</span>(<span class="num">1</span>);               <span class="cmt">// [1,2,3,4] — same result here</span>

[<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>].<span class="fn">some</span>(x => x > <span class="num">2</span>);   <span class="cmt">// true — any match?</span>
[<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>].<span class="fn">every</span>(x => x > <span class="num">0</span>);  <span class="cmt">// true — all match?</span>
[<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>].<span class="fn">find</span>(x => x > <span class="num">1</span>);   <span class="cmt">// 2 — first match</span>
[<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>].<span class="fn">findIndex</span>(x => x > <span class="num">1</span>); <span class="cmt">// 1 — first match index</span></pre>

<div class="tip"><strong>Chaining best practices:</strong> map → filter → reduce. Don't use reduce for things map/filter handle cleaner. Never mutate inside map/filter — these are pure transformation functions.</div>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">Implement a pipe(f1, f2, f3) function using reduce<span class="chev">▼</span></div><div class="qa-a"><pre style="margin:0;font-size:12px"><code>const pipe = (...fns) => x => fns.reduce((v, fn) => fn(v), x);
const add1 = x => x + 1;
const double = x => x * 2;
const process = pipe(add1, double);
process(3); // (3+1)*2 = 8</code></pre>Each function in the pipeline receives the output of the previous function. This is functional composition — foundational to FP patterns in JS.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is the difference between map and forEach?<span class="chev">▼</span></div><div class="qa-a"><code>map</code> returns a new array of the same length with transformed elements — it's a pure transformation used in functional pipelines. <code>forEach</code> returns <code>undefined</code> — it's for side effects (logging, DOM updates). You can't chain <code>forEach</code>, and it can't be used in place of <code>map</code> when you need the result array.</div></div>
`
},
{
  id:10, title:"Destructuring & spread/rest",
  why:"Used constantly in modern React and Node.js code. Interviewers test nested destructuring, defaults, and renaming — easy to get wrong under pressure. Also essential for writing clean function signatures.",
  tags:["⭐ Must-know","Syntax fluency"],
  body:`
<div class="section-label">Object destructuring</div>
<pre><span class="kw">const</span> user = { name: <span class="str">"Satvashil"</span>, age: <span class="num">25</span>, city: <span class="str">"Pune"</span> };

<span class="cmt">// Basic</span>
<span class="kw">const</span> { name, age } = user;

<span class="cmt">// Rename</span>
<span class="kw">const</span> { name: fullName } = user; <span class="cmt">// fullName = "Satvashil"</span>

<span class="cmt">// Default value (used if key is undefined)</span>
<span class="kw">const</span> { country = <span class="str">"India"</span> } = user; <span class="cmt">// "India"</span>

<span class="cmt">// Nested</span>
<span class="kw">const</span> { address: { street } } = {
  address: { street: <span class="str">"MG Road"</span> }
};

<span class="cmt">// Rest — collect remaining keys</span>
<span class="kw">const</span> { name: n, ...rest } = user;
<span class="cmt">// rest = { age: 25, city: "Pune" }</span></pre>

<div class="section-label">Array destructuring</div>
<pre><span class="kw">const</span> [a, b, c] = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>];

<span class="cmt">// Skip elements</span>
<span class="kw">const</span> [first, , third] = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>]; <span class="cmt">// first=1, third=3</span>

<span class="cmt">// Rest</span>
<span class="kw">const</span> [head, ...tail] = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>]; <span class="cmt">// head=1, tail=[2,3]</span>

<span class="cmt">// Swap without temp variable</span>
<span class="kw">let</span> x = <span class="num">1</span>, y = <span class="num">2</span>;
[x, y] = [y, x]; <span class="cmt">// x=2, y=1</span>

<span class="cmt">// useState in React is array destructuring!</span>
<span class="kw">const</span> [count, setCount] = useState(<span class="num">0</span>);</pre>

<div class="section-label">Spread operator — ...</div>
<pre><span class="cmt">// Spread arrays</span>
<span class="kw">const</span> a = [<span class="num">1</span>, <span class="num">2</span>], b = [<span class="num">3</span>, <span class="num">4</span>];
<span class="kw">const</span> combined = [...a, ...b]; <span class="cmt">// [1,2,3,4]</span>
<span class="kw">const</span> copy = [...a];           <span class="cmt">// shallow copy</span>

<span class="cmt">// Spread objects</span>
<span class="kw">const</span> defaults = { theme: <span class="str">"dark"</span>, lang: <span class="str">"en"</span> };
<span class="kw">const</span> config   = { ...defaults, lang: <span class="str">"hi"</span> }; <span class="cmt">// {theme:"dark", lang:"hi"}</span>
<span class="cmt">// Later spread wins for duplicate keys</span>

<span class="cmt">// In function calls</span>
Math.<span class="fn">max</span>(...[<span class="num">1</span>, <span class="num">5</span>, <span class="num">3</span>]); <span class="cmt">// 5</span></pre>

<div class="section-label">Rest parameters — gather into array</div>
<pre><span class="kw">function</span> <span class="fn">sum</span>(...nums) {             <span class="cmt">// rest: gathers args</span>
  <span class="kw">return</span> nums.<span class="fn">reduce</span>((a, b) => a + b, <span class="num">0</span>);
}
<span class="fn">sum</span>(<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>); <span class="cmt">// 10</span>

<span class="cmt">// Mix positional and rest</span>
<span class="kw">function</span> <span class="fn">first</span>(a, b, ...rest) {
  console.<span class="fn">log</span>(a, b, rest); <span class="cmt">// 1, 2, [3,4,5]</span>
}
<span class="fn">first</span>(<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>, <span class="num">5</span>);</pre>

<div class="gotcha"><strong>Shallow copy warning:</strong> Spread only copies one level deep. Nested objects/arrays are still references. <code>const b = {...a}</code> — modifying <code>b.nested.x</code> also modifies <code>a.nested.x</code>. For deep clone, use <code>structuredClone(obj)</code> (modern) or JSON roundtrip (no functions/undefined).</div>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What's the difference between spread and rest — they look identical?<span class="chev">▼</span></div><div class="qa-a">Same <code>...</code> syntax, different context. <strong>Spread</strong> expands an iterable into individual elements — used in function calls, array/object literals. <strong>Rest</strong> collects multiple elements into an array — used in destructuring assignments and function parameter lists. The position in the expression determines which it is.</div></div>
`
},
{
  id:11, title:"Modules: CommonJS vs ESM",
  why:"You'll be asked why a Node.js project uses require() while a Next.js app uses import. Understanding module systems is critical for debugging circular dependencies, understanding tree-shaking, and writing correct Node.js serverless code.",
  tags:["⭐ Must-know","Node.js + frontend"],
  body:`
<div class="section-label">CommonJS (CJS)</div>
<p class="prose">The original Node.js module system. <code>require()</code> is synchronous — it reads, compiles, and returns the module immediately. This works for server-side file system access but doesn't work in browsers.</p>

<pre><span class="cmt">// Exporting (module.exports)</span>
<span class="cmt">// math.js</span>
<span class="kw">function</span> <span class="fn">add</span>(a, b) { <span class="kw">return</span> a + b; }
module.exports = { add };
<span class="cmt">// or: module.exports.add = add;</span>
<span class="cmt">// or: exports.add = add; (shorthand, same object)</span>

<span class="cmt">// Importing</span>
<span class="kw">const</span> { add } = require(<span class="str">"./math"</span>);
<span class="kw">const</span> math     = require(<span class="str">"./math"</span>); <span class="cmt">// whole object</span>

<span class="cmt">// require() is evaluated at runtime — can be conditional:</span>
<span class="kw">if</span> (process.env.NODE_ENV === <span class="str">"dev"</span>) {
  <span class="kw">const</span> logger = require(<span class="str">"./dev-logger"</span>);
}</pre>

<div class="section-label">ES Modules (ESM)</div>
<p class="prose">The official JavaScript module standard (ES2015+). Uses static <code>import</code>/<code>export</code> — evaluated at parse time, before code runs. This enables <strong>tree-shaking</strong> (bundlers can statically determine what is used and eliminate dead code).</p>

<pre><span class="cmt">// Exporting — math.mjs or math.js (with "type":"module")</span>
<span class="kw">export function</span> <span class="fn">add</span>(a, b) { <span class="kw">return</span> a + b; }
<span class="kw">export const</span> PI = <span class="num">3.14159</span>;
<span class="kw">export default</span> <span class="kw">function</span> <span class="fn">multiply</span>(a, b) { <span class="kw">return</span> a * b; }

<span class="cmt">// Importing</span>
<span class="kw">import</span> multiply, { add, PI } <span class="kw">from</span> <span class="str">"./math.js"</span>;
<span class="kw">import</span> * <span class="kw">as</span> math <span class="kw">from</span> <span class="str">"./math.js"</span>; <span class="cmt">// namespace import</span>

<span class="cmt">// Dynamic import (returns a Promise — works in both systems)</span>
<span class="kw">const</span> { add } = <span class="kw">await</span> import(<span class="str">"./math.js"</span>);</pre>

<div class="section-label">Key differences</div>
<div class="pill-row"><span class="pill pill-amber">CJS: synchronous</span><span class="pill pill-purple">ESM: async/static</span></div>

<pre><span class="cmt">// CJS caches modules — same object returned on every require()
// Mutating it affects all importers!</span>
<span class="kw">const</span> config = require(<span class="str">"./config"</span>);
config.debug = <span class="kw">true</span>; <span class="cmt">// ⚠️ global mutation</span>

<span class="cmt">// ESM: live bindings — exported variable changes are reflected</span>
<span class="cmt">// counter.mjs</span>
<span class="kw">export let</span> count = <span class="num">0</span>;
<span class="kw">export</span> <span class="kw">function</span> <span class="fn">increment</span>() { count++; }

<span class="cmt">// main.mjs</span>
<span class="kw">import</span> { count, increment } <span class="kw">from</span> <span class="str">"./counter.mjs"</span>;
console.<span class="fn">log</span>(count); <span class="cmt">// 0</span>
<span class="fn">increment</span>();
console.<span class="fn">log</span>(count); <span class="cmt">// 1 — live binding updates!</span></pre>

<div class="section-label">Tree-shaking</div>
<pre><span class="cmt">// Only using 'add' from a large utility library</span>
<span class="kw">import</span> { add } <span class="kw">from</span> <span class="str">"./big-math-library"</span>;

<span class="cmt">// Bundler (Webpack/Rollup/Vite) sees the static import,
// knows only 'add' is used, and ELIMINATES 'multiply', 'divide',
// etc. from the final bundle — tree-shaking.
//
// With CJS: require() is dynamic — bundler can't statically
// analyze what's used → entire library is bundled.</span></pre>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">Why can't you use require() in Next.js client components?<span class="chev">▼</span></div><div class="qa-a">Next.js uses Webpack/Turbopack which processes ES Modules natively. The browser doesn't have a <code>require</code> function — it's Node.js-only. Next.js client components run in the browser, so they must use ESM <code>import</code>. Next.js server components run in Node.js and technically could use <code>require</code>, but the codebase uses ESM throughout for consistency and to enable tree-shaking and module graph analysis.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is a circular dependency and why is it problematic in CJS vs ESM?<span class="chev">▼</span></div><div class="qa-a">Circular dependency: module A imports B, and B imports A. In CJS, when A requires B and B requires A, B gets the partially-evaluated A module (an incomplete export object) — a common source of <code>undefined</code> bugs. In ESM, circular imports work better because bindings are live — modules can reference each other's exports even if the values aren't set yet, as long as they're resolved by the time they're used.</div></div>
`
},
{
  id:12, title:"Error handling",
  why:"Production-quality error handling is a signal of seniority. Interviewers expect you to handle async errors, build custom error hierarchies, and reason about unhandled rejections — not just wrap code in try/catch blindly.",
  tags:["⭐ Must-know","Production code quality"],
  body:`
<div class="section-label">try / catch / finally</div>
<pre><span class="kw">try</span> {
  <span class="kw">const</span> data = JSON.<span class="fn">parse</span>(invalidJson); <span class="cmt">// throws SyntaxError</span>
  riskyOperation(data);
} <span class="kw">catch</span> (err) {
  <span class="cmt">// err is the thrown value (usually an Error object)</span>
  console.<span class="fn">error</span>(err.name, err.message, err.stack);
  <span class="cmt">// Handle or re-throw</span>
} <span class="kw">finally</span> {
  <span class="cmt">// ALWAYS runs — even if try returns or catch re-throws</span>
  <span class="fn">cleanup</span>(); <span class="cmt">// close DB connection, release lock, etc.</span>
}</pre>

<div class="section-label">Custom error classes</div>
<pre><span class="cmt">// Extend Error for meaningful error types</span>
<span class="kw">class</span> AppError <span class="kw">extends</span> Error {
  <span class="fn">constructor</span>(message, statusCode) {
    <span class="kw">super</span>(message);
    <span class="kw">this</span>.name = <span class="str">"AppError"</span>;
    <span class="kw">this</span>.statusCode = statusCode;
    Error.<span class="fn">captureStackTrace</span>(<span class="kw">this</span>, <span class="kw">this</span>.constructor); <span class="cmt">// Node.js</span>
  }
}

<span class="kw">class</span> NotFoundError <span class="kw">extends</span> AppError {
  <span class="fn">constructor</span>(resource) {
    <span class="kw">super</span>(<span class="str">\`\${resource} not found\`</span>, <span class="num">404</span>);
    <span class="kw">this</span>.name = <span class="str">"NotFoundError"</span>;
  }
}

<span class="cmt">// In Express error handler:</span>
app.<span class="fn">use</span>((err, req, res, next) => {
  <span class="kw">if</span> (err <span class="kw">instanceof</span> AppError) {
    res.<span class="fn">status</span>(err.statusCode).<span class="fn">json</span>({ error: err.message });
  } <span class="kw">else</span> {
    res.<span class="fn">status</span>(<span class="num">500</span>).<span class="fn">json</span>({ error: <span class="str">"Internal server error"</span> });
  }
});</pre>

<div class="section-label">Async error handling</div>
<pre><span class="cmt">// async/await — wrap in try/catch</span>
<span class="kw">async function</span> <span class="fn">getUser</span>(id) {
  <span class="kw">try</span> {
    <span class="kw">return await</span> db.<span class="fn">findUser</span>(id);
  } <span class="kw">catch</span> (err) {
    <span class="kw">throw new</span> <span class="fn">NotFoundError</span>(<span class="str">\`User \${id}\`</span>);
  }
}

<span class="cmt">// Express async error wrapper — avoids try/catch in every route</span>
<span class="kw">const</span> asyncHandler = fn => (req, res, next) =>
  Promise.<span class="fn">resolve</span>(<span class="fn">fn</span>(req, res, next)).<span class="fn">catch</span>(next);

app.<span class="fn">get</span>(<span class="str">"/user/:id"</span>, asyncHandler(<span class="kw">async</span> (req, res) => {
  <span class="kw">const</span> user = <span class="kw">await</span> <span class="fn">getUser</span>(req.params.id);
  res.<span class="fn">json</span>(user);
})); <span class="cmt">// any thrown error goes to the error middleware via next(err)</span></pre>

<div class="section-label">Unhandled promise rejections</div>
<pre><span class="cmt">// Node.js — global handler (last resort, not a replacement for .catch)</span>
process.<span class="fn">on</span>(<span class="str">"unhandledRejection"</span>, (reason, promise) => {
  console.<span class="fn">error</span>(<span class="str">"Unhandled rejection:"</span>, reason);
  <span class="cmt">// In production: log to monitoring service, then process.exit(1)</span>
});

process.<span class="fn">on</span>(<span class="str">"uncaughtException"</span>, (err) => {
  console.<span class="fn">error</span>(<span class="str">"Uncaught exception:"</span>, err);
  process.<span class="fn">exit</span>(<span class="num">1</span>); <span class="cmt">// process is in unknown state — must exit</span>
});</pre>

<div class="gotcha"><strong>Don't swallow errors silently:</strong> <code>catch(err => {})</code> is one of the worst things you can write. At minimum, log the error. Silent failures are the hardest bugs to diagnose in production. Always either handle, re-throw, or propagate.</div>

<div class="section-label">Error vs rejection — key distinction</div>
<pre><span class="cmt">// Thrown errors are caught by try/catch or .catch()</span>
<span class="cmt">// Rejected promises that are NOT awaited escape try/catch!</span>

<span class="kw">async function</span> <span class="fn">bad</span>() {
  <span class="kw">try</span> {
    failingPromise(); <span class="cmt">// ❌ NOT awaited — rejection escapes catch</span>
  } <span class="kw">catch</span> (e) {
    <span class="cmt">// never reached</span>
  }
}

<span class="kw">async function</span> <span class="fn">good</span>() {
  <span class="kw">try</span> {
    <span class="kw">await</span> <span class="fn">failingPromise</span>(); <span class="cmt">// ✅ rejection is caught</span>
  } <span class="kw">catch</span> (e) {
    <span class="cmt">// caught!</span>
  }
}</pre>

<div class="section-label">Interview questions</div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">Does finally run if the catch block re-throws?<span class="chev">▼</span></div><div class="qa-a">Yes. <code>finally</code> always runs — whether the try block completes normally, returns a value, throws an error, or the catch block re-throws. The only exception is <code>process.exit()</code> or a system crash. This makes <code>finally</code> ideal for cleanup code (closing files, releasing database connections) that must run regardless of success or failure.</div></div>
<div class="qa"><div class="qa-q" onclick="tgl(this)">What is the difference between an Error and a Promise rejection?<span class="chev">▼</span></div><div class="qa-a">An Error is a synchronous exception — thrown with <code>throw</code> and caught with <code>try/catch</code>. A Promise rejection is an async "error" — it occurs on the promise timeline and is caught with <code>.catch()</code> or a <code>try/catch</code> around an <code>await</code>. If you throw inside an async function, it becomes a rejected promise. If you throw inside a <code>.then()</code> callback, the promise chain catches it as a rejection. The key rule: always await a promise if you want <code>try/catch</code> to work on it.</div></div>
`
}
];

const seen = new Set();

function buildNav() {
  const container = document.getElementById('nav-items');
  topics.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'nav-item' + (i === 0 ? ' active' : '');
    el.onclick = () => showTopic(i);
    el.innerHTML = `<span class="nav-num">${t.id}</span><span>${t.title}</span>`;
    container.appendChild(el);
  });
  updateProgress();
}

function showTopic(idx) {
  document.querySelectorAll('.nav-item').forEach((el,i) => el.classList.toggle('active', i===idx));
  const t = topics[idx];
  seen.add(idx);
  const tags = t.tags.map(tag => `<span class="pill ${tag.includes('⭐') ? 'pill-purple' : 'pill-amber'}">${tag}</span>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="topic-header">
      <div class="topic-title">${t.id}. ${t.title}</div>
      <div class="pill-row">${tags}</div>
      <div class="topic-why">${t.why}</div>
    </div>
    ${t.body}
  `;
  updateProgress();
  document.getElementById('content').scrollTop = 0;
}

function updateProgress() {
  const total = topics.length;
  const done = seen.size;
  document.getElementById('prog').textContent = `${done} / ${total} topics visited`;
}

function tgl(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.chev');
  const open = body.classList.toggle('open');
  chev.classList.toggle('open', open);
}

buildNav();
showTopic(0);
</script>
